name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nph
        run: nimble install -y nph@0.7.0

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        nim-version: ['2.2.8', '2.2.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ matrix.nim-version }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-${{ matrix.nim-version }}-

      - name: Clear compilation cache
        run: rm -rf ~/.cache/nim

      - name: Install test dependencies
        run: nimble install -y results chronos

      - name: Run tests
        run: nimble test

      - name: Compile examples
        run: nimble compileExamples

      - name: Run examples
        run: |
          for f in examples/*.nim; do
            echo "Running: $f"
            nim c -r --hints:off "$f"
          done

  downstream-lockfree:
    name: 'downstream: lockfree'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout typestates
        uses: actions/checkout@v4
        with:
          path: nim-typestates

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install local typestates and build CLI
        run: |
          cd nim-typestates
          nimble install -y
          nimble buildCli
          sudo cp bin/typestates /usr/local/bin/typestates || true
          mkdir -p ~/.nimble/bin
          cp bin/typestates ~/.nimble/bin/typestates

      - name: Checkout lockfree
        uses: actions/checkout@v4
        with:
          repository: elijahr/lockfree
          path: lockfree

      - name: Test lockfree against typestates
        run: |
          cd lockfree
          nimble refresh -y || true
          CURRENT_VERSION=$(grep 'version       =' ../nim-typestates/typestates.nimble | cut -d'"' -f2)
          sed -i.bak "s/requires \"typestates >= .*/requires \"typestates >= $CURRENT_VERSION\"/" lockfree.nimble
          rm -f lockfree.nimble.bak
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done
          typestates verify -W --format=github src/
          LFQ_TEST_VARIANT=orc nimble test

  release:
    name: 'release'
    runs-on: ubuntu-latest
    needs: [lint, test, downstream-lockfree]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section found for version $version" >&2
            exit 1
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release_notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release_notes.md
          fi
