name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install nph
        # Pinned to match the version documented in .pre-commit-config.yaml.
        # Floating on latest causes spurious format-diff churn between local
        # pre-commit and CI when nph's formatting output changes across
        # releases.
        run: nimble install -y nph@0.7.0

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 2.2.0 is the minimum supported Nim (per typestates.nimble) and
        # exercises the < 2.2.8 path of the codegen-bug gate. 2.2.8 is the
        # boundary version containing the nim-lang/Nim#25341 fix and
        # exercises the >= 2.2.8 path. Bump explicitly when supporting
        # newer Nim; do NOT use `stable` (moves silently).
        nim-version: ['2.2.8', '2.2.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ matrix.nim-version }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-${{ matrix.nim-version }}-

      - name: Clear compilation cache
        run: rm -rf ~/.cache/nim

      - name: Install test dependencies
        run: nimble install -y results chronos

      - name: Run tests
        run: nimble test

      - name: Compile examples
        run: nimble compileExamples

      - name: Run examples
        run: |
          for f in examples/*.nim; do
            echo "Running: $f"
            nim c -r --hints:off "$f"
          done

  downstream-lockfree:
    name: 'downstream: lockfree'
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout typestates
        uses: actions/checkout@v4
        with:
          path: nim-typestates

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install local typestates and build CLI
        run: |
          cd nim-typestates
          nimble install -y
          nimble buildCli
          sudo cp bin/typestates /usr/local/bin/typestates || true
          mkdir -p ~/.nimble/bin
          cp bin/typestates ~/.nimble/bin/typestates

      - name: Checkout lockfree
        uses: actions/checkout@v4
        with:
          repository: elijahr/lockfree
          path: lockfree

      - name: Test lockfree against typestates
        run: |
          cd lockfree
          nimble refresh -y || true
          CURRENT_VERSION=$(grep 'version       =' ../nim-typestates/typestates.nimble | cut -d'"' -f2)
          sed -i.bak "s/requires \"typestates >= .*/requires \"typestates >= $CURRENT_VERSION\"/" lockfree.nimble
          rm -f lockfree.nimble.bak
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done
          typestates verify -W --format=github src/
          LFQ_TEST_VARIANT=orc nimble test
