name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install nph
        # Pinned to match the version documented in .pre-commit-config.yaml.
        # Floating on latest causes spurious format-diff churn between local
        # pre-commit and CI when nph's formatting output changes across
        # releases.
        run: nimble install -y nph@0.7.0

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 2.2.0 is the minimum supported Nim (per typestates.nimble) and
        # exercises the < 2.2.8 path of the codegen-bug gate. 2.2.8 is the
        # boundary version containing the nim-lang/Nim#25341 fix and
        # exercises the >= 2.2.8 path. Bump explicitly when supporting
        # newer Nim; do NOT use `stable` (moves silently).
        nim-version: ['2.2.8', '2.2.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ matrix.nim-version }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-${{ matrix.nim-version }}-

      - name: Clear compilation cache
        run: rm -rf ~/.cache/nim

      - name: Install test dependencies
        run: nimble install -y results chronos

      - name: Run tests
        run: nimble test

      - name: Compile examples
        run: nimble compileExamples

      - name: Run examples
        run: |
          for f in examples/*.nim; do
            echo "Running: $f"
            nim c -r --hints:off "$f"
          done
